name: Release Programmable Launch CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @programmable/launch package version at this production commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: programmable-launch-cli-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish exact CLI release
    if: >-
      github.repository_id == 1314365508 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      github.ref_protected == true &&
      github.actor == 'hazarxyz' &&
      github.actor_id == '258789013' &&
      github.triggering_actor == 'hazarxyz' &&
      github.run_attempt == 1 &&
      github.event.sender.login == 'hazarxyz' &&
      github.event.sender.id == 258789013
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Bind detached checkout to protected production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/programmable-release-git-askpass"
          trap 'rm -f -- "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --no-tags --prune origin \
            +refs/heads/production:refs/remotes/origin/production
          rm -f -- "$askpass"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/production^{commit})" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/production"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-programmable-launch.yml@$GITHUB_REF"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Install exact Cosign verifier
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          cosign_dir="$(mktemp -d "$RUNNER_TEMP/cosign-v3.1.3.XXXXXX")"
          chmod 0700 "$cosign_dir"
          cosign="$cosign_dir/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64" \
            --output "$cosign"
          printf '%s  %s\n' \
            '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' \
            "$cosign" | sha256sum --check --strict
          chmod 0700 "$cosign"
          echo "PROGRAMMABLE_COSIGN_BIN=$cosign" >> "$GITHUB_ENV"

      - name: Set up exact npm
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.16.0"

      - name: Verify owner-authenticated immutable-release preflight
        env:
          IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64 }}
          IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64"
          test -n "$IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64"
          node scripts/verify-immutable-release-owner-preflight.mjs \
            --record-base64 "$IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64" \
            --signature-base64 "$IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64" \
            --allowed-signers "$GITHUB_WORKSPACE/.github/release-trust/programmable-launch-immutable-release-owner.allowed_signers" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "1314365508" \
            --revision "$GITHUB_SHA" \
            --environment "production" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --actor-login "$GITHUB_ACTOR"

      - name: Install exact root dependency closure
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve exact production Verify proof
        id: resolve-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --verification-mode change
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact immutable production Verify proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/production-verify-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-proof.outputs.verify_run_id }}
          digest-mismatch: error

      - name: Verify proof provenance and exact source binding
        id: verify-proof
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ steps.resolve-proof.outputs.artifact_digest }}
          VERIFY_RUN_ID: ${{ steps.resolve-proof.outputs.verify_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ steps.resolve-proof.outputs.verify_run_attempt }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/production-verify-proof/production-verify-proof.json"
          test -f "$proof"
          gh attestation verify "$proof" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/production-verify-attestation.json"
          node scripts/production-verify-proof.mjs verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --proof "$proof" \
            --run-id "$VERIFY_RUN_ID" \
            --run-attempt "$VERIFY_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --verification-mode change \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate requested release identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("packages/launch/package.json", "utf8"));
            if (pkg.name !== "@programmable/launch" || pkg.version !== process.env.EXPECTED_VERSION) {
              throw new Error("Requested release does not match the exact package identity");
            }
            if (pkg.packageManager !== "npm@11.16.0") {
              throw new Error("Package manager does not match the exact release toolchain");
            }
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/u.test(pkg.version)) {
              throw new Error("Package version is not an exact supported release version");
            }
          '
          echo "tag=programmable-launch-v$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_glob=$RUNNER_TEMP/programmable-launch-release/*" >> "$GITHUB_OUTPUT"

      - name: Require exact V4 policy, profile, deployment, and machine-contract binding
        if: ${{ startsWith(inputs.version, '4.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PROGRAMMABLE_PRODUCTION_VERIFY_PROOF: ${{ runner.temp }}/production-verify-proof/production-verify-proof.json
        run: |
          set -euo pipefail
          case "$EXPECTED_VERSION" in
            4.0.0)
              export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$GITHUB_WORKSPACE/release/robinhood-chain-4663/programmable-backend-authorization.json"
              node scripts/programmable-launch-v4-release-binding.mjs verify-release-ready --repository-root "$GITHUB_WORKSPACE"
              ;;
            4.1.0)
              export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$GITHUB_WORKSPACE/release/robinhood-chain-4663/v4.1/programmable-backend-authorization.json"
              node scripts/programmable-launch-v41-release-binding.mjs verify-release-ready --repository-root "$GITHUB_WORKSPACE"
              ;;
            4.1.1)
              export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$GITHUB_WORKSPACE/release/robinhood-chain-4663/v4.1/programmable-backend-authorization.json"
              node scripts/programmable-launch-v411-release-binding.mjs verify-release-ready --repository-root "$GITHUB_WORKSPACE"
              ;;
            4.1.2)
              export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$GITHUB_WORKSPACE/release/robinhood-chain-4663/v4.1/programmable-backend-authorization.json"
              node scripts/programmable-launch-v412-release-binding.mjs verify-release-ready --repository-root "$GITHUB_WORKSPACE"
              ;;
            4.1.3)
              export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$GITHUB_WORKSPACE/release/robinhood-chain-4663/v4.1/programmable-backend-authorization.json"
              node scripts/programmable-launch-v413-release-binding.mjs verify-release-ready --repository-root "$GITHUB_WORKSPACE"
              ;;
            *) echo "Unsupported V4 release version" >&2; exit 1 ;;
          esac

      - name: Verify V4 clean-room no-broadcast runner contract
        if: ${{ startsWith(inputs.version, '4.') }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$EXPECTED_VERSION" in
            4.0.0) npm run release:custom-launch:v4:clean-room:test ;;
            4.1.0) node --test scripts/test/programmable-launch-v41-clean-room.test.mjs scripts/test/programmable-launch-v41-clean-room-workflow.test.mjs scripts/test/programmable-v41-api-activation.test.mjs scripts/test/programmable-launch-v41-release-binding.test.mjs contracts/scripts/test/robinhood-custom-launch-v41-promotion.test.mjs scripts/test/robinhood-custom-launch-v41-promotion-workflow.test.mjs ;;
            4.1.1) node --test scripts/test/programmable-launch-v41-clean-room.test.mjs scripts/test/programmable-launch-v41-clean-room-workflow.test.mjs scripts/test/programmable-v41-api-activation.test.mjs scripts/test/programmable-launch-v41-release-binding.test.mjs contracts/scripts/test/robinhood-custom-launch-v41-promotion.test.mjs scripts/test/robinhood-custom-launch-v41-promotion-workflow.test.mjs scripts/test/programmable-launch-v411-release-binding.test.mjs ;;
            4.1.2) node --test scripts/test/programmable-launch-v41-clean-room.test.mjs scripts/test/programmable-launch-v41-clean-room-workflow.test.mjs scripts/test/programmable-v41-api-activation.test.mjs scripts/test/programmable-launch-v41-release-binding.test.mjs contracts/scripts/test/robinhood-custom-launch-v41-promotion.test.mjs scripts/test/robinhood-custom-launch-v41-promotion-workflow.test.mjs scripts/test/programmable-launch-v411-release-binding.test.mjs scripts/test/programmable-launch-v412-release-binding.test.mjs ;;
            4.1.3) node --test scripts/test/programmable-launch-v41-clean-room.test.mjs scripts/test/programmable-launch-v41-clean-room-workflow.test.mjs scripts/test/programmable-v41-api-activation.test.mjs scripts/test/programmable-launch-v41-release-binding.test.mjs contracts/scripts/test/robinhood-custom-launch-v41-promotion.test.mjs scripts/test/robinhood-custom-launch-v41-promotion-workflow.test.mjs scripts/test/programmable-launch-v411-release-binding.test.mjs scripts/test/programmable-launch-v412-release-binding.test.mjs scripts/test/programmable-launch-v413-release-binding.test.mjs ;;
            *) echo "Unsupported V4 release version" >&2; exit 1 ;;
          esac

      - name: Require protected CLI tags and a fresh release identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64 }}
          IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64 }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          rulesets="$RUNNER_TEMP/programmable-launch-tag-rulesets.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/rulesets" \
            --output "$rulesets"
          ruleset_id="$(jq -r '.[] | select(.name == "Protect Programmable Launch CLI release tags" and .target == "tag" and .enforcement == "active") | .id' "$rulesets")"
          test "$ruleset_id" = "21679403"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" \
            --output "$rulesets"
          node scripts/verify-programmable-launch-tag-ruleset.mjs "$rulesets" --owner-preflight
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists and will not be changed." >&2
            exit 1
          fi
          if gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists and will not be reused." >&2
            exit 1
          fi

      - name: Install exact runtime dependency closure
        working-directory: packages/launch
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused public package gates
        working-directory: packages/launch
        run: |
          set -euo pipefail
          npm test
          npm run verify:machine-contracts
          npm run pack:dry-run

      - name: Build and self-verify deterministic release assets
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PROGRAMMABLE_PRODUCTION_VERIFY_PROOF: ${{ runner.temp }}/production-verify-proof/production-verify-proof.json
          PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION: ${{ github.workspace }}/release/robinhood-chain-4663/${{ (inputs.version == '4.1.0' || inputs.version == '4.1.1' || inputs.version == '4.1.2' || inputs.version == '4.1.3') && 'v4.1/' || '' }}programmable-backend-authorization.json
        run: |
          set -euo pipefail
          node scripts/programmable-launch-release-assets.mjs build \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/programmable-launch-release" \
            --source-ref "$GITHUB_REF" \
            --expected-version "$EXPECTED_VERSION"

      - name: Attest all exact release assets
        id: attest-assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.identity.outputs.asset_glob }}

      - name: Verify exact asset provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP"/programmable-launch-release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-programmable-launch.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          done

      - name: Reconfirm protected production tip immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64 }}
          IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64: ${{ vars.PROGRAMMABLE_IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64"
          test -n "$IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64"
          node scripts/verify-immutable-release-owner-preflight.mjs \
            --record-base64 "$IMMUTABLE_RELEASES_PREFLIGHT_RECORD_BASE64" \
            --signature-base64 "$IMMUTABLE_RELEASES_PREFLIGHT_SIGNATURE_BASE64" \
            --allowed-signers "$GITHUB_WORKSPACE/.github/release-trust/programmable-launch-immutable-release-owner.allowed_signers" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "1314365508" \
            --revision "$GITHUB_SHA" \
            --environment "production" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --actor-login "$GITHUB_ACTOR"
          rulesets="$RUNNER_TEMP/programmable-launch-tag-ruleset-before-publication.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/rulesets/21679403" > "$rulesets"
          node scripts/verify-programmable-launch-tag-ruleset.mjs "$rulesets" --owner-preflight
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/production" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/production^{commit})" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freshly revalidate exact V4 Phase B immediately before mutation
        if: ${{ startsWith(inputs.version, '4.') }}
        id: fresh-v4-release
        env:
          PROGRAMMABLE_PRODUCTION_VERIFY_PROOF: ${{ runner.temp }}/production-verify-proof/production-verify-proof.json
          EXPECTED_VERSION: ${{ inputs.version }}
          PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION: ${{ github.workspace }}/release/robinhood-chain-4663/${{ (inputs.version == '4.1.0' || inputs.version == '4.1.1' || inputs.version == '4.1.2' || inputs.version == '4.1.3') && 'v4.1/' || '' }}programmable-backend-authorization.json
          ETHEREUM_MAINNET_RPC_URL_PRIMARY: ${{ secrets.ETHEREUM_MAINNET_RPC_URL_PRIMARY }}
          ETHEREUM_MAINNET_RPC_URL_SECONDARY: ${{ secrets.ETHEREUM_MAINNET_RPC_URL_SECONDARY }}
          FLY_API_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_API_FLY_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ROBINHOOD_MAINNET_RPC_URL_PRIMARY: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL_PRIMARY }}
          ROBINHOOD_MAINNET_RPC_URL_SECONDARY: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL_SECONDARY }}
        run: |
          set -euo pipefail
          test -n "$ROBINHOOD_MAINNET_RPC_URL_PRIMARY"
          test -n "$ROBINHOOD_MAINNET_RPC_URL_SECONDARY"
          test -n "$ETHEREUM_MAINNET_RPC_URL_PRIMARY"
          test -n "$ETHEREUM_MAINNET_RPC_URL_SECONDARY"
          test -n "$FLY_API_TOKEN"
          test -f "$PROGRAMMABLE_PRODUCTION_VERIFY_PROOF"
          evidence="$GITHUB_WORKSPACE/release/robinhood-chain-4663"
          case "$EXPECTED_VERSION" in
            4.0.0)
              promotion_evidence="$evidence"
              finalizer="contracts/scripts/finalize-robinhood-custom-launch-deployment.mjs"
              ;;
            4.1.0|4.1.1|4.1.2|4.1.3)
              promotion_evidence="$evidence/v4.1"
              finalizer="contracts/scripts/finalize-robinhood-custom-launch-v41-deployment.mjs"
              ;;
            *) echo "Unsupported V4 release version" >&2; exit 1 ;;
          esac
          export PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION="$promotion_evidence/programmable-backend-authorization.json"
          test -f "$PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION"
          coordinates="$evidence/production-verify-coordinates.json"
          result="$RUNNER_TEMP/programmable-launch-v4-fresh-apply.json"
          run_id="$(jq -er '.runId | select(test("^[1-9][0-9]*$"))' "$coordinates")"
          run_attempt="$(jq -er '.runAttempt | select(test("^[1-9][0-9]*$"))' "$coordinates")"
          artifact_id="$(jq -er '.artifactId | select(test("^[1-9][0-9]*$"))' "$coordinates")"
          artifact_digest="$(jq -er '.artifactDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$coordinates")"
          node "$finalizer" apply \
            --bundle "$promotion_evidence/programmable-promotion-bundle.json" \
            --stage "$evidence/programmable-stage-bundle.json" \
            --capture "$evidence/programmable-postdeployment-capture.json" \
            --backend-input "$promotion_evidence/backend-promotion-input.public.json" \
            --backend-attestation-bundle "$promotion_evidence/backend-promotion-input.attestation.json" \
            --backend-authorization "$promotion_evidence/programmable-backend-authorization.json" \
            --backend-authorization-attestation-bundle "$promotion_evidence/programmable-backend-authorization.attestation.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --capture-attestation-bundle "$evidence/programmable-postdeployment-capture.attestation.json" \
            --stage-attestation-bundle "$evidence/programmable-stage-bundle.attestation.json" \
            --source-verify-proof "$evidence/production-verify-proof.json" \
            --source-verify-attestation-bundle "$evidence/production-verify-proof.attestation.json" \
            --source-verify-run-id "$run_id" \
            --source-verify-run-attempt "$run_attempt" \
            --source-verify-artifact-id "$artifact_id" \
            --source-verify-artifact-digest "$artifact_digest" \
            > "$result"
          expected_phase_b_digest="$(jq -er \
            '.promotionBundleDigest | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$promotion_evidence/programmable-promotion-bundle.json")"
          test "$(jq -er '.command' "$result")" = "apply"
          test "$(jq -er '.releaseReady' "$result")" = "true"
          test "$(jq -er '.publicAuthorization' "$result")" = "true"
          test "$(jq -er '.publicWrites' "$result")" = "true"
          test "$(jq -er '.wroteLiveArtifacts' "$result")" = "false"
          test "$(jq -er '.preparedArtifactPreserved' "$result")" = "true"
          test "$(jq -er '.replayed' "$result")" = "false"
          phase_b_digest="$(jq -er \
            '.promotionBundleDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$result")"
          provider_digest="$(jq -er \
            '.freshProviderReadbackDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$result")"
          sourcify_digest="$(jq -er \
            '.freshSourceVerificationClosureDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$result")"
          backend_digest="$(jq -er \
            '.freshBackendReadbackDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$result")"
          fresh_observed_at="$(jq -er \
            '.freshObservedAt | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.000)?Z$"))' \
            "$result")"
          test "$phase_b_digest" = "$expected_phase_b_digest"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "phase_b_digest=$phase_b_digest" >> "$GITHUB_OUTPUT"
          echo "provider_digest=$provider_digest" >> "$GITHUB_OUTPUT"
          echo "sourcify_digest=$sourcify_digest" >> "$GITHUB_OUTPUT"
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "fresh_observed_at=$fresh_observed_at" >> "$GITHUB_OUTPUT"

      - name: Atomically create exact tag ref and immutable GitHub Release
        env:
          FRESH_BACKEND_DIGEST: ${{ steps.fresh-v4-release.outputs.backend_digest }}
          FRESH_OBSERVED_AT: ${{ steps.fresh-v4-release.outputs.fresh_observed_at }}
          FRESH_PROVIDER_DIGEST: ${{ steps.fresh-v4-release.outputs.provider_digest }}
          FRESH_SOURCIFY_DIGEST: ${{ steps.fresh-v4-release.outputs.sourcify_digest }}
          GH_TOKEN: ${{ github.token }}
          PHASE_B_DIGEST: ${{ steps.fresh-v4-release.outputs.phase_b_digest }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/production" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [[ "$VERSION" == 4.* ]]; then
            [[ "$PHASE_B_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$FRESH_PROVIDER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$FRESH_SOURCIFY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$FRESH_BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$FRESH_OBSERVED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.000)?Z$ ]]
          fi
          tag_response="$RUNNER_TEMP/programmable-launch-tag-ref-create.json"
          tag_payload="$(jq -cn \
            --arg ref "refs/tags/$TAG" \
            --arg sha "$GITHUB_SHA" \
            '{ref: $ref, sha: $sha}')"
          tag_status="$(curl --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "$tag_payload" \
            --output "$tag_response" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs")"
          if [ "$tag_status" = "422" ]; then
            echo "GitHub rejected atomic tag creation with HTTP 422; the tag will not be reused." >&2
            exit 1
          fi
          test "$tag_status" = "201"
          test "$(jq -er '.ref' "$tag_response")" = "refs/tags/$TAG"
          test "$(jq -er '.object.type' "$tag_response")" = "commit"
          test "$(jq -er '.object.sha' "$tag_response")" = "$GITHUB_SHA"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          notes="$RUNNER_TEMP/programmable-launch-release-notes.md"
          {
            echo "Exact-source public pack, validate, submit, and status CLI."
            echo
            echo "- Exact source commit: \`$GITHUB_SHA\`"
            if [[ "$VERSION" == 4.* ]]; then
              echo "- Phase B promotion digest: \`$PHASE_B_DIGEST\`"
              echo "- Fresh provider readback digest: \`$FRESH_PROVIDER_DIGEST\`"
              echo "- Fresh Sourcify closure digest: \`$FRESH_SOURCIFY_DIGEST\`"
              echo "- Fresh backend readback digest: \`$FRESH_BACKEND_DIGEST\`"
              echo "- Common fresh observation: \`$FRESH_OBSERVED_AT\`"
            fi
            echo
            echo "Verify every downloaded asset with GitHub attestations and the published release manifest. The CLI never signs or broadcasts wallet transactions."
          } > "$notes"
          gh release create "$TAG" \
            "$RUNNER_TEMP"/programmable-launch-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Programmable Launch CLI $VERSION" \
            --notes-file "$notes"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq '(.isDraft == false) and (.isImmutable == true)')" = "true"

      - name: Fresh-download and verify the published release
        env:
          PROGRAMMABLE_PRODUCTION_VERIFY_PROOF: ${{ runner.temp }}/production-verify-proof/production-verify-proof.json
          PROGRAMMABLE_ROBINHOOD_BACKEND_AUTHORIZATION: ${{ github.workspace }}/release/robinhood-chain-4663/${{ (inputs.version == '4.1.0' || inputs.version == '4.1.1' || inputs.version == '4.1.2' || inputs.version == '4.1.3') && 'v4.1/' || '' }}programmable-backend-authorization.json
          EXPECTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/programmable-launch-release-download"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/programmable-launch-release-download"
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for asset in "$RUNNER_TEMP"/programmable-launch-release-download/*; do
            gh release verify-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
          node scripts/programmable-launch-release-assets.mjs verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/programmable-launch-release-download" \
            --source-ref "$GITHUB_REF" \
            --expected-version "$EXPECTED_VERSION"

      - name: Record release evidence
        env:
          ATTESTATION_URL: ${{ steps.attest-assets.outputs.attestation-url }}
          FRESH_BACKEND_DIGEST: ${{ steps.fresh-v4-release.outputs.backend_digest }}
          FRESH_OBSERVED_AT: ${{ steps.fresh-v4-release.outputs.fresh_observed_at }}
          FRESH_PROVIDER_DIGEST: ${{ steps.fresh-v4-release.outputs.provider_digest }}
          FRESH_SOURCIFY_DIGEST: ${{ steps.fresh-v4-release.outputs.sourcify_digest }}
          PHASE_B_DIGEST: ${{ steps.fresh-v4-release.outputs.phase_b_digest }}
          PROOF_SHA256: ${{ steps.verify-proof.outputs.proof_sha256 }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Programmable Launch CLI release"
            echo
            echo "- Exact source commit: \`$GITHUB_SHA\`"
            echo "- Production Verify proof: \`$PROOF_SHA256\`"
            echo "- Immutable release tag: \`$TAG\`"
            echo "- Asset attestation: $ATTESTATION_URL"
            if [[ "$VERSION" == 4.* ]]; then
              echo "- Phase B promotion digest: \`$PHASE_B_DIGEST\`"
              echo "- Fresh provider readback digest: \`$FRESH_PROVIDER_DIGEST\`"
              echo "- Fresh Sourcify closure digest: \`$FRESH_SOURCIFY_DIGEST\`"
              echo "- Fresh backend readback digest: \`$FRESH_BACKEND_DIGEST\`"
              echo "- Common fresh observation: \`$FRESH_OBSERVED_AT\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconfirm protected production tip at completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/production" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
