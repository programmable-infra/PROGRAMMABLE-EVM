name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Verify the complete current Custom V2 tree for an exact Generic production release
        required: true
        type: choice
        options:
          - custom-v2-release

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      custom_v2: ${{ steps.scope.outputs.custom_v2 }}
      database: ${{ steps.scope.outputs.database }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      indexer: ${{ steps.scope.outputs.indexer }}
      interface: ${{ steps.scope.outputs.interface }}
      interface_guidance_only: ${{ steps.scope.outputs.interface_guidance_only }}
      interface_presentation_only: ${{ steps.scope.outputs.interface_presentation_only }}
      read_model: ${{ steps.scope.outputs.read_model }}
      robinhood_phase_b_evidence: ${{ steps.scope.outputs.robinhood_phase_b_evidence }}
      robinhood_phase_b_evidence_exact: ${{ steps.scope.outputs.robinhood_phase_b_evidence_exact }}
      robinhood_v41_phase_b_evidence: ${{ steps.scope.outputs.robinhood_v41_phase_b_evidence }}
      robinhood_v41_phase_b_evidence_exact: ${{ steps.scope.outputs.robinhood_v41_phase_b_evidence_exact }}

    steps:
      - name: Check out complete change history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up the locked copy parser runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$VERIFICATION_MODE" = custom-v2-release ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/production
            node scripts/ci/classify-verify-paths.mjs --custom-v2-release > "$RUNNER_TEMP/verify-scope.txt"
          elif [ "$VERIFICATION_MODE" != change ]; then
            echo "Verification mode is invalid" >&2
            exit 1
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            node scripts/ci/classify-verify-paths.mjs --all > "$RUNNER_TEMP/verify-scope.txt"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"

            if git cat-file -e "$BASE_SHA:scripts/ci/classify-verify-paths.mjs"; then
              git show "$BASE_SHA:scripts/ci/classify-verify-paths.mjs" > "$RUNNER_TEMP/classify-verify-paths.mjs"
              node "$RUNNER_TEMP/classify-verify-paths.mjs" "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/verify-scope.txt"
            else
              # The bootstrap change has no trusted-base classifier yet, so it
              # deliberately pays the complete gate once.
              node scripts/ci/classify-verify-paths.mjs --all > "$RUNNER_TEMP/verify-scope.txt"
            fi
          fi

          # The first production commit that adds the Custom V2 lane is still
          # classified by its trusted base. Pay the new lane once without
          # changing or narrowing any trusted-base legacy result.
          if ! grep -Eq '^custom_v2=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'custom_v2=true' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          # A trusted base without the content-aware optimization always pays
          # full Interface coverage, including the change introducing it.
          if ! grep -Eq '^interface_guidance_only=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'interface_guidance_only=false' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          # The trusted classifier can prove TSX copy edits with the unchanged
          # locked parser. CSS and images need no dependency installation here.
          if grep -q '^interface_presentation_candidate=true$' "$RUNNER_TEMP/verify-scope.txt" &&
            ! grep -q '^interface_presentation_only=true$' "$RUNNER_TEMP/verify-scope.txt"; then
            npm ci --ignore-scripts --no-audit --no-fund
            node "$RUNNER_TEMP/classify-verify-paths.mjs" "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/verify-scope.txt"
          fi
          if ! grep -Eq '^interface_presentation_only=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'interface_presentation_only=false' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          if ! grep -Eq '^robinhood_phase_b_evidence=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'robinhood_phase_b_evidence=false' >> "$RUNNER_TEMP/verify-scope.txt"
            echo 'robinhood_phase_b_evidence_exact=false' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          # Land the successor gate before its separate exact-pair evidence PR;
          # the trusted base, never the evidence change, selects this lane.
          if ! grep -Eq '^robinhood_v41_phase_b_evidence=(true|false)$' "$RUNNER_TEMP/verify-scope.txt"; then
            echo 'robinhood_v41_phase_b_evidence=false' >> "$RUNNER_TEMP/verify-scope.txt"
            echo 'robinhood_v41_phase_b_evidence_exact=false' >> "$RUNNER_TEMP/verify-scope.txt"
          fi
          cat "$RUNNER_TEMP/verify-scope.txt" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Credential leak gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete change history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan exact change history
        env:
          PROGRAMMABLE_GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/run-gitleaks-ci.sh

  indexer:
    name: Realtime indexer
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.indexer == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.indexer == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Pin pnpm
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          npm install --global pnpm@10.32.0
          test "$(pnpm --version)" = "10.32.0"

      - name: Install indexer dependencies
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: pnpm install --frozen-lockfile

      - name: Audit indexer production dependencies
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          node --test ../scripts/ci/run-indexer-dependency-audit.test.mjs
          node ../scripts/ci/run-indexer-dependency-audit.mjs

      - name: Generate and verify indexer
        if: needs.scope.outputs.indexer == 'true'
        working-directory: indexer
        run: |
          pnpm codegen
          pnpm typecheck
          pnpm test

      - name: Skip unaffected indexer
        if: needs.scope.result == 'success' && needs.scope.outputs.indexer != 'true'
        run: echo "No indexer paths changed."

  database-pglite:
    name: Database (PGlite)
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.database == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.database == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.database == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run fresh-database SQL tests
        if: needs.scope.outputs.database == 'true'
        run: npm run db:test:pglite

      - name: Verify database-backed website runtime
        if: needs.scope.outputs.database == 'true'
        run: npm run test:database-runtime:ci

      - name: Skip unaffected database
        if: needs.scope.result == 'success' && needs.scope.outputs.database != 'true'
        run: echo "No database paths changed."

  interface-quality:
    name: Interface quality and tests
    needs: scope
    if: needs.scope.outputs.interface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.interface_presentation_only != 'true'
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: needs.scope.outputs.interface == 'true' && needs.scope.outputs.dependencies == 'true'
        run: |
          node --test scripts/ci/run-production-dependency-audit.test.mjs
          npm run audit:prod

      - name: Verify interface quality and tests
        if: needs.scope.outputs.interface_presentation_only != 'true' && (needs.scope.outputs.interface_guidance_only != 'true' || needs.scope.outputs.custom_v2 == 'true')
        env:
          PROGRAMMABLE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROGRAMMABLE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:interface:quality:ci

      - name: Verify exact guide URL changes and their direct consumers
        if: needs.scope.outputs.interface_guidance_only == 'true' && needs.scope.outputs.custom_v2 != 'true'
        env:
          PROGRAMMABLE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROGRAMMABLE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:interface:guidance:ci

      - name: Use build coverage for presentation changes
        if: needs.scope.outputs.interface_presentation_only == 'true'
        run: echo "Only styles, images or copy changed. No unrelated interface test suites required."

  interface-browser-build:
    # Browser fixtures and the production build share mutable local output.
    # Keep them sequential in one checkout, isolated from lint and unit tests.
    name: Interface browser and build
    needs: scope
    if: needs.scope.outputs.interface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium for wallet interaction tests
        if: needs.scope.outputs.interface_presentation_only != 'true' && (needs.scope.outputs.interface_guidance_only != 'true' || needs.scope.outputs.custom_v2 == 'true')
        run: npx playwright install --with-deps chromium

      - name: Verify interface browser interactions and production build
        if: needs.scope.outputs.interface_presentation_only != 'true' && (needs.scope.outputs.interface_guidance_only != 'true' || needs.scope.outputs.custom_v2 == 'true')
        env:
          PROGRAMMABLE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROGRAMMABLE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:interface:browser-build:ci

      - name: Build the complete production interface for guide URL changes
        if: needs.scope.outputs.interface_guidance_only == 'true' && needs.scope.outputs.custom_v2 != 'true'
        env:
          PROGRAMMABLE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROGRAMMABLE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Build presentation changes
        if: needs.scope.outputs.interface_presentation_only == 'true'
        run: npm run build

      - name: Require complete Git history for the V4 release audit
        if: needs.scope.outputs.interface_presentation_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --no-tags origin
          fi
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Verify V4 clean-room no-broadcast release gate
        if: needs.scope.outputs.interface_presentation_only != 'true'
        run: npm run release:custom-launch:v4:clean-room:test

      - name: Verify V4 public API activation evidence
        if: needs.scope.outputs.interface_presentation_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/test/programmable-v4-api-activation.test.mjs
          node scripts/programmable-v4-api-activation.mjs audit --repository-root "$GITHUB_WORKSPACE"

      - name: Verify V4.1 public API activation evidence
        if: needs.scope.outputs.interface_presentation_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/test/programmable-v41-api-activation.test.mjs
          node scripts/programmable-v41-api-activation.mjs audit --repository-root "$GITHUB_WORKSPACE"

      - name: Verify affected read-model operations contract
        if: needs.scope.outputs.read_model == 'true'
        run: npm run perf:read-model:ops-gate

  interface:
    # Preserve the required check and production-proof result while both
    # independent jobs verify the same source with their own locked install.
    name: Interface
    needs:
      - scope
      - interface-quality
      - interface-browser-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Require complete interface verification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          INTERFACE_REQUIRED: ${{ needs.scope.outputs.interface }}
          READ_MODEL_REQUIRED: ${{ needs.scope.outputs.read_model }}
          GUIDANCE_ONLY: ${{ needs.scope.outputs.interface_guidance_only }}
          PRESENTATION_ONLY: ${{ needs.scope.outputs.interface_presentation_only }}
          FUNCTIONAL_SCOPES: ${{ needs.scope.outputs.contracts }},${{ needs.scope.outputs.custom_v2 }},${{ needs.scope.outputs.database }},${{ needs.scope.outputs.dependencies }},${{ needs.scope.outputs.indexer }},${{ needs.scope.outputs.read_model }}
          QUALITY_RESULT: ${{ needs.interface-quality.result }}
          BROWSER_BUILD_RESULT: ${{ needs.interface-browser-build.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$PRESENTATION_ONLY" in
            true)
              test "$INTERFACE_REQUIRED" = true
              test "$GUIDANCE_ONLY" = false
              test "$FUNCTIONAL_SCOPES" = false,false,false,false,false,false
              ;;
            false) ;;
            *) echo "Interface presentation scope is missing or invalid." >&2; exit 1 ;;
          esac
          case "$GUIDANCE_ONLY" in
            true)
              test "$INTERFACE_REQUIRED" = true
              test "$FUNCTIONAL_SCOPES" = false,false,false,false,false,false
              ;;
            false) ;;
            *) echo "Interface guidance scope is missing or invalid." >&2; exit 1 ;;
          esac
          if [ "$READ_MODEL_REQUIRED" = true ]; then
            test "$INTERFACE_REQUIRED" = true
          fi
          case "$INTERFACE_REQUIRED" in
            true) expected_result=success ;;
            false) expected_result=skipped ;;
            *) echo "Interface scope is missing or invalid." >&2; exit 1 ;;
          esac
          for result in "$QUALITY_RESULT" "$BROWSER_BUILD_RESULT"; do
            test "$result" = "$expected_result" || {
              echo "Interface lane did not complete as required: $result (expected $expected_result)" >&2
              exit 1
            }
          done
          if [ "$INTERFACE_REQUIRED" = false ]; then
            echo "No interface paths changed."
          fi

  contracts-build:
    name: Contracts build
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify contract orchestration and complete test coverage
        run: node --test scripts/ci/contracts-ci.test.mjs scripts/ci/verify-contracts-workflow.test.mjs contracts/scripts/verify-fork-tests-ci.test.mjs

      - name: Build the complete default contract profile once
        run: node scripts/ci/contracts-ci.mjs build

      - name: Bind the build to this source, run, attempt, and toolchain
        run: node scripts/ci/contracts-ci.mjs receipt

      - name: Preserve this run's complete compiler outputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            contracts/out
            contracts/cache
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  contracts-tests-1:
    name: Contracts tests (1/2)
    needs: [scope, contracts-build]
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download only this run's contract build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.contracts-build.outputs.artifact-id }}
          path: contracts
          digest-mismatch: error

      - name: Verify exact contract build source and toolchain
        run: node scripts/ci/contracts-ci.mjs verify-receipt

      - name: Verify the complete deterministic test partition
        env:
          ETHEREUM_RPC_URL: https://mainnet.gateway.tenderly.co
          ETHEREUM_ARCHIVE_RPC_URL: https://eth.drpc.org
        run: node scripts/ci/contracts-ci.mjs test 1

  contracts-tests-2:
    name: Contracts tests (2/2)
    needs: [scope, contracts-build]
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download only this run's contract build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.contracts-build.outputs.artifact-id }}
          path: contracts
          digest-mismatch: error

      - name: Verify exact contract build source and toolchain
        run: node scripts/ci/contracts-ci.mjs verify-receipt

      - name: Verify the complete deterministic test partition
        env:
          ETHEREUM_RPC_URL: https://mainnet.gateway.tenderly.co
          ETHEREUM_ARCHIVE_RPC_URL: https://eth.drpc.org
        run: node scripts/ci/contracts-ci.mjs test 2

  contracts-release:
    name: Contracts release and forks
    needs: [scope, contracts-build]
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download only this run's contract build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.contracts-build.outputs.artifact-id }}
          path: contracts
          digest-mismatch: error

      - name: Verify exact contract build source and toolchain
        run: node scripts/ci/contracts-ci.mjs verify-receipt

      - name: Verify contract release bindings, forks, and late migration
        env:
          LATE_MIGRATION_FORK_RPC_URL: https://eth-mainnet.public.blastapi.io
          FOUNDATION_RPC_URL: ${{ secrets.ROBINHOOD_FOUNDATION_FORK_RPC_URL }}
        run: |
          : "${FOUNDATION_RPC_URL:?Configure the funded Robinhood fork RPC secret}"
          node scripts/ci/contracts-ci.mjs release

  contracts-analysis:
    name: Contracts static analysis
    # Slither creates its own complete build-info for each profile; it does
    # not consume the default artifact and need not wait for that producer.
    needs: [scope]
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install exact Slither
        run: pipx install slither-analyzer==0.11.5

      - name: Run all isolated source compiler profiles
        run: node scripts/ci/contracts-ci.mjs analysis

  contracts:
    name: Contracts
    needs: [scope, contracts-build, contracts-tests-1, contracts-tests-2, contracts-release, contracts-analysis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require complete contract verification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CONTRACTS_REQUIRED: ${{ needs.scope.outputs.contracts }}
          BUILD_RESULT: ${{ needs.contracts-build.result }}
          TESTS_1_RESULT: ${{ needs.contracts-tests-1.result }}
          TESTS_2_RESULT: ${{ needs.contracts-tests-2.result }}
          RELEASE_RESULT: ${{ needs.contracts-release.result }}
          ANALYSIS_RESULT: ${{ needs.contracts-analysis.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$CONTRACTS_REQUIRED" in
            true) expected_result=success ;;
            false) expected_result=skipped ;;
            *) echo "Contracts scope is missing or invalid." >&2; exit 1 ;;
          esac
          for result in "$BUILD_RESULT" "$TESTS_1_RESULT" "$TESTS_2_RESULT" "$RELEASE_RESULT" "$ANALYSIS_RESULT"; do
            test "$result" = "$expected_result" || {
              echo "Contract lane did not complete: $result (expected $expected_result)" >&2
              exit 1
            }
          done

      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence == 'true' ||
          needs.scope.outputs.robinhood_v41_phase_b_evidence == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence == 'true' ||
          needs.scope.outputs.robinhood_v41_phase_b_evidence == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Reject partial or mixed Robinhood Phase B backend evidence imports
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence == 'true' &&
          needs.scope.outputs.robinhood_phase_b_evidence_exact != 'true'
        run: exit 1

      - name: Reject partial or mixed Robinhood V4.1 Phase B backend evidence imports
        if: >-
          needs.scope.outputs.robinhood_v41_phase_b_evidence == 'true' &&
          needs.scope.outputs.robinhood_v41_phase_b_evidence_exact != 'true'
        run: exit 1

      - name: Install locked dependencies for exact Robinhood Phase B backend evidence
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true' ||
          needs.scope.outputs.robinhood_v41_phase_b_evidence_exact == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install exact Cosign verifier for Robinhood Phase B backend evidence
        if: >-
          needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true' ||
          needs.scope.outputs.robinhood_v41_phase_b_evidence_exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          cosign_dir="$(mktemp -d "$RUNNER_TEMP/cosign-v3.1.3.XXXXXX")"
          chmod 0700 "$cosign_dir"
          cosign="$cosign_dir/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64" \
            --output "$cosign"
          printf '%s  %s\n' \
            '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' \
            "$cosign" | sha256sum --check --strict
          chmod 0700 "$cosign"
          echo "PROGRAMMABLE_COSIGN_BIN=$cosign" >> "$GITHUB_ENV"

      - name: Verify exact fresh Robinhood Phase B backend evidence
        if: needs.scope.outputs.robinhood_phase_b_evidence_exact == 'true'
        run: |
          set -euo pipefail
          for evidence_path in \
            release/robinhood-chain-4663/backend-promotion-input.attestation.json \
            release/robinhood-chain-4663/backend-promotion-input.public.json
          do
            test "$(git ls-files --stage -- "$evidence_path" | awk '{print $1}')" = "100644"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
            test "$(stat -c '%a' "$evidence_path")" = "644"
          done
          node contracts/scripts/finalize-robinhood-custom-launch-deployment.mjs \
            verify-backend-import \
            --stage release/robinhood-chain-4663/programmable-stage-bundle.json \
            --backend-input release/robinhood-chain-4663/backend-promotion-input.public.json \
            --backend-attestation-bundle \
              release/robinhood-chain-4663/backend-promotion-input.attestation.json \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Verify exact fresh Robinhood V4.1 Phase B backend evidence
        if: needs.scope.outputs.robinhood_v41_phase_b_evidence_exact == 'true'
        run: |
          set -euo pipefail
          for evidence_path in \
            release/robinhood-chain-4663/v4.1/backend-promotion-input.attestation.json \
            release/robinhood-chain-4663/v4.1/backend-promotion-input.public.json
          do
            test "$(git ls-files --stage -- "$evidence_path" | awk '{print $1}')" = "100644"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
            test "$(stat -c '%a' "$evidence_path")" = "644"
          done
          node contracts/scripts/finalize-robinhood-custom-launch-v41-deployment.mjs \
            verify-backend-import \
            --stage release/robinhood-chain-4663/programmable-stage-bundle.json \
            --backend-input release/robinhood-chain-4663/v4.1/backend-promotion-input.public.json \
            --backend-attestation-bundle \
              release/robinhood-chain-4663/v4.1/backend-promotion-input.attestation.json \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Skip unaffected contracts
        if: >-
          needs.scope.result == 'success' &&
          needs.scope.outputs.contracts != 'true' &&
          needs.scope.outputs.robinhood_phase_b_evidence != 'true' &&
          needs.scope.outputs.robinhood_v41_phase_b_evidence != 'true'
        run: echo "No contract paths changed."

  custom-v2:
    name: Custom V2
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful change classification
        if: needs.scope.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.scope.outputs.custom_v2 == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        if: needs.scope.outputs.custom_v2 == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.custom_v2 == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify exact Website projection database operator
        if: needs.scope.outputs.custom_v2 == 'true'
        run: >-
          node --test
          scripts/website-projection-db-operator.test.mjs
          scripts/website-projection-db-credential-rotation.test.mjs

      - name: Verify exact Generic V2 read-model contract derivation
        if: needs.scope.outputs.custom_v2 == 'true'
        run: node --test scripts/test/custom-v2-read-model-contract-v2.test.mjs

      # The Interface lane already runs the complete application Vitest set,
      # lint, and production build. Only share within this exact workflow run;
      # the protected aggregate and production proof require Interface success.
      - name: Verify Custom V2 checks using this run's Interface coverage
        if: needs.scope.outputs.custom_v2 == 'true' && needs.scope.outputs.interface == 'true' && needs.scope.outputs.interface_guidance_only != 'true'
        run: npm run verify:custom-v2:checks:ci

      - name: Verify Custom V2 operations when Interface does not select them
        if: >-
          needs.scope.outputs.custom_v2 == 'true' &&
          needs.scope.outputs.interface == 'true' &&
          needs.scope.outputs.interface_guidance_only != 'true' &&
          needs.scope.outputs.read_model != 'true'
        run: npm run perf:read-model:ops-gate

      - name: Verify exact Custom V2 surface
        if: needs.scope.outputs.custom_v2 == 'true' && (needs.scope.outputs.interface != 'true' || needs.scope.outputs.interface_guidance_only == 'true')
        run: npm run verify:custom-v2:ci

      - name: Skip unaffected Custom V2
        if: needs.scope.result == 'success' && needs.scope.outputs.custom_v2 != 'true'
        run: echo "No Custom V2 paths changed."

  production-proof:
    name: Bind production Verify proof
    # Scoped workers may be skipped transitively; attest only after every
    # protected aggregate has explicitly succeeded in this same run.
    if: >-
      always() && !cancelled() &&
      needs.scope.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      needs.indexer.result == 'success' &&
      needs.database-pglite.result == 'success' &&
      needs.interface.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.custom-v2.result == 'success' &&
      needs.aggregate.result == 'success' &&
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.verification_mode == 'custom-v2-release'))
    needs:
      - scope
      - secret-scan
      - indexer
      - database-pglite
      - interface
      - contracts
      - custom-v2
      - aggregate
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact verified production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Create exact production Verify proof
        env:
          PRODUCTION_VERIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
          PRODUCTION_VERIFY_SCOPE_CONTRACTS: ${{ needs.scope.outputs.contracts }}
          PRODUCTION_VERIFY_SCOPE_CUSTOM_V2: ${{ needs.scope.outputs.custom_v2 }}
          PRODUCTION_VERIFY_SCOPE_DATABASE: ${{ needs.scope.outputs.database }}
          PRODUCTION_VERIFY_SCOPE_DEPENDENCIES: ${{ needs.scope.outputs.dependencies }}
          PRODUCTION_VERIFY_SCOPE_INDEXER: ${{ needs.scope.outputs.indexer }}
          PRODUCTION_VERIFY_SCOPE_INTERFACE: ${{ needs.scope.outputs.interface }}
          PRODUCTION_VERIFY_SCOPE_READ_MODEL: ${{ needs.scope.outputs.read_model }}
          PRODUCTION_VERIFY_SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          PRODUCTION_VERIFY_INDEXER_RESULT: ${{ needs.scope.outputs.indexer == 'true' && needs.indexer.result || 'skipped' }}
          PRODUCTION_VERIFY_DATABASE_PGLITE_RESULT: ${{ needs.scope.outputs.database == 'true' && needs.database-pglite.result || 'skipped' }}
          PRODUCTION_VERIFY_INTERFACE_RESULT: ${{ needs.scope.outputs.interface == 'true' && needs.interface.result || 'skipped' }}
          PRODUCTION_VERIFY_CONTRACTS_RESULT: ${{ needs.scope.outputs.contracts == 'true' && needs.contracts.result || 'skipped' }}
          PRODUCTION_VERIFY_CUSTOM_V2_RESULT: ${{ needs.scope.outputs.custom_v2 == 'true' && needs.custom-v2.result || 'skipped' }}
        run: >-
          node scripts/production-verify-proof.mjs create
          --repository-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/production-verify-proof.json"

      - name: Attest exact production Verify proof
        id: attest-proof
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/production-verify-proof.json

      - name: Preserve immutable production Verify proof
        id: upload-proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verify-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-verify-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Record exact production Verify proof
        env:
          ATTESTATION_URL: ${{ steps.attest-proof.outputs.attestation-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-proof.outputs.artifact-digest }}
          PRODUCTION_VERIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || 'change' }}
        run: |
          {
            echo "## Production Verify proof"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Event/mode: \`$GITHUB_EVENT_NAME\` / \`$PRODUCTION_VERIFY_MODE\`"
            echo "- Artifact SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- Sigstore attestation: $ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    # Keep one stable, always-run PR context while the lane jobs remain
    # independently addressable and path-routed. The production proof above
    # remains separate and binds either exact path-scoped push verification or
    # an explicit current-tree Custom V2 release verification.
    name: Verify aggregate
    needs:
      - scope
      - secret-scan
      - indexer
      - database-pglite
      - interface
      - contracts
      - custom-v2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every protected verification lane to complete
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          INDEXER_RESULT: ${{ needs.indexer.result }}
          DATABASE_RESULT: ${{ needs.database-pglite.result }}
          INTERFACE_RESULT: ${{ needs.interface.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CUSTOM_V2_RESULT: ${{ needs.custom-v2.result }}
        run: |
          set -euo pipefail
          for result in "$SCOPE_RESULT" "$SECRET_SCAN_RESULT" "$INDEXER_RESULT" "$DATABASE_RESULT" "$INTERFACE_RESULT" "$CONTRACTS_RESULT" "$CUSTOM_V2_RESULT"; do
            test "$result" = success || {
              echo "Verification lane did not succeed: $result" >&2
              exit 1
            }
          done
