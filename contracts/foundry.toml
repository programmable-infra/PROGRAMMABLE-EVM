[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000
bytecode_hash = "none"
cbor_metadata = false
ffi = false
# These surfaces use separate source-bound compiler profiles. The protected
# Contracts release lane and npm verify run their complete suites separately.
skip = ["src/late-migration/**", "test/late-migration/**", "src/module-foundation/**", "test/module-foundation/**", "script/module-foundation/**"]
fs_permissions = [
  { access = "read", path = "./dependencies" },
  { access = "read", path = "./spec" },
  { access = "read", path = "./out" }
]

[profile.default.fuzz]
runs = 1_000
max_test_rejects = 65_536

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1_000, depth = 128, fail_on_revert = false }

# Source-bound foundation compiler profile; does not change existing deployments.
[profile.module-foundation]
skip = []
src = "src/module-foundation"
test = "test/module-foundation"
script = "script/module-foundation"
out = "out/module-foundation"
cache_path = "cache/module-foundation"
via_ir = true
optimizer_runs = 200
auto_detect_remappings = false

[profile.module-foundation.fuzz]
runs = 1_000
max_test_rejects = 65_536

[profile.module-foundation.invariant]
# Same bounded stateful campaign as the source's recorded verification runs.
runs = 32
depth = 24
fail_on_revert = true

# Dependency-free focused checks for the optional launch wallet cap.
[profile.launch-wallet-cap]
skip = []
src = "src/module-foundation/modules/launch-wallet-cap"
test = "test/module-foundation/launch-wallet-cap"
script = "script/module-foundation/modules/launch-wallet-cap"
out = "out/launch-wallet-cap"
cache_path = "cache/launch-wallet-cap"
via_ir = true
optimizer_runs = 200
auto_detect_remappings = false

# The late-migration intake uses IR compilation, while enabling IR for the
# repository-wide profile currently exposes unrelated legacy Yul stack limits.
# Keep this release surface isolated and reproducible without changing the
# compiler settings used by any existing contract suite.
[profile.late-migration]
skip = []
src = "src/late-migration"
test = "test/late-migration"
script = "script/late-migration"
via_ir = true
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "../config/late-migration-eligibility.v1.json" }]

[profile.late-migration.fuzz]
runs = 1_000
max_test_rejects = 65_536

[profile.late-migration.invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
